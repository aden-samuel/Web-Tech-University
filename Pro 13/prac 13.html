<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Talent Hub | HR Workflow Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-shell {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background-color: #0f172a;
            color: #ffffff;
            padding: 24px 18px;
            border-right: 3px solid #2563eb;
            flex-shrink: 0;
        }

        .brand-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-box strong {
            display: block;
            color: #38bdf8;
            font-size: 15px;
            letter-spacing: 0.4px;
        }

        .brand-box span {
            font-size: 11px;
            color: #94a3b8;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-list li {
            margin-bottom: 8px;
        }

        .nav-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #1e293b;
            color: #ffffff;
            border-left: 3px solid #2563eb;
        }

        .workspace {
            flex: 1;
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .top-bar h1 {
            font-size: 20px;
            margin: 0;
        }

        .search-input {
            padding: 9px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            width: 240px;
        }

        .search-input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .task-form-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 22px;
        }

        .task-form-bar input, .task-form-bar select {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        .task-form-bar input[type="text"] {
            flex: 2;
            min-width: 180px;
        }

        .btn-add {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            align-items: start;
        }

        .board-column {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            min-height: 360px;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .column-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        .count-pill {
            background: #e2e8f0;
            color: #334155;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .task-card {
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #2563eb;
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04);
        }

        .card-pending { background-color: #ecfdf5; border-left-color: #10b981; }
        .card-progress { background-color: #fef2f2; border-left-color: #ef4444; }
        .card-completed { background-color: #eff6ff; border-left-color: #2563eb; }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .avatar-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #bae6fd;
            color: #0369a1;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .task-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }

        .task-date {
            font-size: 11px;
            color: #64748b;
            display: block;
            margin-top: 2px;
        }

        .dept-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.8);
            color: #1e293b;
            margin-bottom: 10px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
            padding-top: 8px;
        }

        .mini-btn {
            flex: 1;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 4px 6px;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }

        .mini-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .mini-btn.del:hover {
            border-color: #dc2626;
            color: #dc2626;
        }

        @media (max-width: 860px) {
            .app-shell { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 3px solid #2563eb; }
            .board-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-box">
                <strong>HR TALENT HUB</strong>
                <span>Workflow Task Manager</span>
            </div>
            <ul class="nav-list">
                <li><button class="nav-btn active" onclick="filterByStatus('All', this)">Board (All Statuses)</button></li>
                <li><button class="nav-btn" onclick="filterByStatus('Pending', this)">1. Pending Tasks</button></li>
                <li><button class="nav-btn" onclick="filterByStatus('In Progress', this)">2. In Progress</button></li>
                <li><button class="nav-btn" onclick="filterByStatus('Completed', this)">3. Completed</button></li>
            </ul>
        </aside>

        <main class="workspace">
            <div class="top-bar">
                <h1>HR Operations Task Board</h1>
                <input type="text" id="searchInput" class="search-input" placeholder="Search HR tasks..." oninput="renderBoard()">
            </div>

            <div class="task-form-bar">
                <input type="text" id="taskTitleInput" placeholder="Enter new HR task (e.g., Arrange Payroll Meeting)...">
                <select id="taskDeptSelect">
                    <option value="Payroll & Finance">Payroll &amp; Finance</option>
                    <option value="Recruitment">Recruitment</option>
                    <option value="HR Operations">HR Operations</option>
                    <option value="Compliance">Compliance</option>
                </select>
                <select id="taskStatusSelect">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <button class="btn-add" onclick="createTask()">+ Add Task</button>
            </div>

            <div class="board-grid">
                <div class="board-column" id="col-Pending">
                    <div class="column-header">
                        <h3>Pending</h3>
                        <span class="count-pill" id="count-Pending">0</span>
                    </div>
                    <div id="list-Pending"></div>
                </div>

                <div class="board-column" id="col-In Progress">
                    <div class="column-header">
                        <h3>In Progress</h3>
                        <span class="count-pill" id="count-In Progress">0</span>
                    </div>
                    <div id="list-In Progress"></div>
                </div>

                <div class="board-column" id="col-Completed">
                    <div class="column-header">
                        <h3>Completed</h3>
                        <span class="count-pill" id="count-Completed">0</span>
                    </div>
                    <div id="list-Completed"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let hrTasks = [
            { id: 1, title: 'Arrange Payroll Meeting', dept: 'Payroll & Finance', status: 'Pending', date: '18/11/2026', owner: 'HR' },
            { id: 2, title: 'Review Year-End Tax Audit', dept: 'Payroll & Finance', status: 'Pending', date: '25/11/2026', owner: 'FN' },
            { id: 3, title: 'Conduct Senior Dev Interviews', dept: 'Recruitment', status: 'In Progress', date: '19/11/2026', owner: 'TA' },
            { id: 4, title: 'Update Employee Handbook', dept: 'Compliance', status: 'In Progress', date: '21/11/2026', owner: 'HR' },
            { id: 5, title: 'Provision Onboarding Laptops', dept: 'HR Operations', status: 'Completed', date: '15/11/2026', owner: 'IT' }
        ];

        let activeSidebarFilter = 'All';

        function createTask() {
            const titleInput = document.getElementById('taskTitleInput');
            const deptSelect = document.getElementById('taskDeptSelect');
            const statusSelect = document.getElementById('taskStatusSelect');

            const title = titleInput.value.trim();
            if (title === '') {
                alert('Please enter a task description before adding.');
                titleInput.focus();
                return;
            }

            const newTask = {
                id: Date.now(),
                title: title,
                dept: deptSelect.value,
                status: statusSelect.value,
                date: new Date().toLocaleDateString('en-GB'),
                owner: 'HR'
            };

            hrTasks.push(newTask);
            titleInput.value = '';
            renderBoard();
        }

        function renderBoard() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const statuses = ['Pending', 'In Progress', 'Completed'];

            statuses.forEach(status => {
                const listEl = document.getElementById(`list-${status}`);
                const countEl = document.getElementById(`count-${status}`);
                const colEl = document.getElementById(`col-${status}`);

                colEl.style.display = (activeSidebarFilter === 'All' || activeSidebarFilter === status) ? 'block' : 'none';

                const filtered = hrTasks.filter(t =>
                    t.status === status &&
                    (t.title.toLowerCase().includes(searchQuery) || t.dept.toLowerCase().includes(searchQuery))
                );

                countEl.textContent = filtered.length;
                listEl.innerHTML = '';

                const cardClass = status === 'Pending' ? 'card-pending' :
                                  status === 'In Progress' ? 'card-progress' : 'card-completed';

                filtered.forEach(task => {
                    const card = document.createElement('div');
                    card.className = `task-card ${cardClass}`;
                    card.innerHTML = `
                        <div class="card-top">
                            <div class="avatar-circle">${task.owner}</div>
                            <div>
                                <p class="task-title">${task.title}</p>
                                <span class="task-date">${task.date}</span>
                            </div>
                        </div>
                        <span class="dept-tag">${task.dept}</span>
                        <div class="card-actions">
                            <button class="mini-btn" onclick="editTaskTitle(${task.id})">Edit</button>
                            <button class="mini-btn" onclick="advanceTaskStatus(${task.id})">Move &rarr;</button>
                            <button class="mini-btn del" onclick="deleteTask(${task.id})">Delete</button>
                        </div>
                    `;
                    listEl.appendChild(card);
                });
            });
        }

        function editTaskTitle(id) {
            const task = hrTasks.find(t => t.id === id);
            if (!task) return;

            const updatedTitle = prompt('Update HR task title:', task.title);
            if (updatedTitle !== null && updatedTitle.trim() !== '') {
                task.title = updatedTitle.trim();
                renderBoard();
            }
        }

        function advanceTaskStatus(id) {
            const task = hrTasks.find(t => t.id === id);
            if (!task) return;

            if (task.status === 'Pending') {
                task.status = 'In Progress';
            } else if (task.status === 'In Progress') {
                task.status = 'Completed';
            } else {
                task.status = 'Pending';
            }
            renderBoard();
        }

        function deleteTask(id) {
            hrTasks = hrTasks.filter(t => t.id !== id);
            renderBoard();
        }

        function filterByStatus(status, btnElement) {
            activeSidebarFilter = status;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderBoard();
        }

        renderBoard();
    </script>

</body>
</html>
