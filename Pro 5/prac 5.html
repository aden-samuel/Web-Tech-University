<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Navbar & Layout - Practicum 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .navbar-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border: 2px solid #2563eb;
            border-radius: 8px;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .navbar {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .navbar li {
            position: relative;
        }

        .badge-inline {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 4px;
        }

        .navbar a {
            display: block;
            padding: 18px 16px;
            color: #334155;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .navbar a:hover {
            color: #2563eb;
        }

        .dropdown-menu {
            list-style: none;
            margin: 0;
            padding: 8px 0;
            position: absolute;
            top: 100%;
            left: 0;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: none;
            min-width: 160px;
            z-index: 10;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-menu li a {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: normal;
        }

        .dropdown-menu li a:hover {
            background-color: #f8fafc;
            color: #2563eb;
        }

        .navbar li:nth-last-child(-n+2) {
            margin-left: auto;
        }

        .dashboard-grid {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .grid-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar-container">
        <ul class="navbar">
            <li><a href="#">Dashboard</a></li>
            
            <li class="dropdown">
                <a href="#">Directory ▼</a>
                <ul class="dropdown-menu">
                    <li><a href="#">Org Chart</a></li>
                    <li><a href="#">Teams</a></li>
                    <li><a href="#">Staff Directory</a></li>
                </ul>
            </li>
            
            <li class="dropdown">
                <a href="#">Payroll ▼</a>
                <ul class="dropdown-menu">
                    <li><a href="#">Salary & Comp</a></li>
                    <li><a href="#">Benefits</a></li>
                    <li><a href="#">Tax Forms</a></li>
                </ul>
            </li>

            <li><a href="#">Reports <span class="badge-inline">New</span></a></li>
            <li><a href="#" style="color: #2563eb;">HR Portal</a></li>
        </ul>
    </div>

    <div class="dashboard-grid">
        <div class="grid-card">
            <h3>Active Staff</h3>
            <p style="font-size: 20px; font-weight: bold; color: #2563eb;">142</p>
        </div>
        <div class="grid-card">
            <h3>Open Roles</h3>
            <p style="font-size: 20px; font-weight: bold; color: #16a34a;">8</p>
        </div>
        <div class="grid-card">
            <h3>Pending Reviews</h3>
            <p style="font-size: 20px; font-weight: bold; color: #d97706;">12</p>
        </div>
    </div>

</body>
</html>
