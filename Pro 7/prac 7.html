<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Talent Hub | Responsive Staff Directory</title>
    <link rel="stylesheet" href="Prac 7.css">
</head>
<body>

    <div class="showcase-container">
        
        <div class="gall">

            <!-- Grid Container (Practicum 7 requirement) -->

                <div class="img-card">
                    <img src="Pic 1.jpg" alt="Employee 1" loading="lazy">

                <div class="img-card">
                    <img src="Pic 2.jpg" alt="Employee 2" loading="lazy">

                </div>
                <div class="img-card">
                    <img src="Pic 3.jpg" alt="Employee 3" loading="lazy">
                    <span class="img-caption">Human Resources</span>
                </div>
                <div class="img-card">
                    <img src="Pic 4.jpg" alt="Employee 4" loading="lazy">
                    <span class="img-caption">Executive Leadership</span>
                </div>
                <div class="img-card">
                    <img src="Pic 5.jpg" alt="Employee 5" loading="lazy">
                    <span class="img-caption">Finance & Ops</span>
                </div>
                <div class="img-card">
                    <img src="Pic 6.jpg" alt="Employee 6" loading="lazy">
                    <span class="img-caption">Marketing</span>
                </div>
                <div class="img-card">
                    <img src="Pic 7.jpg" alt="Employee 7" loading="lazy">

                <div class="img-card">
                    <img src="Pic 8.jpg" alt="Employee 8" loading="lazy">

            </div>
        </div>

    </div>

</body>
</html>
