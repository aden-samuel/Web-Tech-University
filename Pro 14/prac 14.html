<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Talent Hub | Employee Policy Assessment</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            width: 100%;
            max-width: 720px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-top: 5px solid #2563eb;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
            padding: 36px 42px;
        }

        .portal-tag {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #2563eb;
            margin-bottom: 18px;
            display: block;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .progress-block {
            width: 210px;
        }

        .progress-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            display: block;
            text-align: center;
        }

        .progress-track {
            width: 100%;
            height: 22px;
            border: 2px solid #2563eb;
            border-radius: 4px;
            background-color: #eff6ff;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 20%;
            background-color: #2563eb;
            transition: width 0.3s ease;
        }

        .score-block {
            text-align: center;
        }

        .score-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            display: block;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 30px;
            font-weight: 700;
            color: #2563eb;
            line-height: 1;
        }

        /* Question Text */
        .question-heading {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
            margin: 0 0 26px 0;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 26px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0;
            cursor: pointer;
            text-align: left;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #2563eb;
            transform: translateX(4px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1);
        }

        .option-letter {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color 0.2s ease;
        }

        .option-text {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            flex: 1;
        }

        .option-btn.correct {
            border-color: #16a34a;
            background-color: #dcfce7;
        }

        .option-btn.correct .option-letter {
            background-color: #16a34a;
        }

        .option-btn.wrong {
            border-color: #dc2626;
            background-color: #fee2e2;
        }

        .option-btn.wrong .option-letter {
            background-color: #dc2626;
        }

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
        }

        .feedback-note {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .next-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 11px 24px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .next-btn:hover {
            background-color: #1d4ed8;
        }

        .next-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .result-summary {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .result-summary h2 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #0f172a;
        }

        .result-summary p {
            font-size: 15px;
            color: #475569;
            margin: 0 0 24px 0;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <span class="portal-tag">HR Talent Hub &bull; Compliance &amp; Onboarding Assessment</span>

        <div class="hud-row" id="hudRow">
            <div class="progress-block">
                <span class="progress-label" id="questionCounter">Question 1/5</span>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="score-block">
                <span class="score-label">Score</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
        </div>

        <div id="quizBody">
            <h1 class="question-heading" id="questionText">Loading question...</h1>

            <div class="options-list" id="optionsContainer"></div>

            <div class="footer-bar">
                <span class="feedback-note" id="feedbackText">Select an option above to continue.</span>
                <button class="next-btn" id="nextButton" onclick="nextQuestion()" disabled>Next Question &rarr;</button>
            </div>
        </div>

        <div class="result-summary" id="resultSection">
            <h2>HR Assessment Completed!</h2>
            <p id="finalScoreText"></p>
            <button class="next-btn" onclick="restartQuiz()">Retake Assessment</button>
        </div>
    </div>

    <script>
        const quizQuestions = [
            {
                question: "In Human Resource Management, what does KPI stand for?",
                options: [
                    "Key Personnel Integration",
                    "Knowledge Process Index",
                    "Key Performance Indicator",
                    "Kinetic Payroll Interface"
                ],
                correctIndex: 2
            },
            {
                question: "Which HR process focuses on integrating newly hired employees into the organization?",
                options: [
                    "Offboarding",
                    "Onboarding",
                    "Benchmarking",
                    "Succession Auditing"
                ],
                correctIndex: 1
            },
            {
                question: "What is the primary purpose of a 360-degree performance appraisal?",
                options: [
                    "Calculating annual overtime taxes",
                    "Gathering feedback from peers, managers, and direct reports",
                    "Tracking daily biometric attendance logs",
                    "Determining office seating allocations"
                ],
                correctIndex: 1
            },
            {
                question: "Which document outlines employee conduct, leave policies, and workplace compliance rules?",
                options: [
                    "Vendor Purchase Order",
                    "Employee Handbook",
                    "Quarterly Balance Sheet",
                    "System Architecture Blueprint"
                ],
                correctIndex: 1
            },
            {
                question: "In payroll administration, what does CTC represent?",
                options: [
                    "Corporate Tax Clearance",
                    "Centralized Time Card",
                    "Cost to Company",
                    "Certified Training Credit"
                ],
                correctIndex: 2
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let hasAnswered = false;

        const letters = ['A', 'B', 'C', 'D'];

        function loadQuestion() {
            hasAnswered = false;
            const currentQ = quizQuestions[currentIndex];

            document.getElementById('questionCounter').textContent = `Question ${currentIndex + 1}/${quizQuestions.length}`;
            const progressPercent = ((currentIndex + 1) / quizQuestions.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;

            document.getElementById('questionText').textContent = currentQ.question;
            document.getElementById('feedbackText').textContent = 'Select an option above to continue.';
            document.getElementById('feedbackText').style.color = '#64748b';

            const nextBtn = document.getElementById('nextButton');
            nextBtn.disabled = true;
            nextBtn.textContent = currentIndex === quizQuestions.length - 1 ? 'Finish Assessment' : 'Next Question \u2192';

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.replaceChildren();

            currentQ.options.forEach((optionText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.type = 'button';
                btn.onclick = () => selectAnswer(idx, btn);

                const letterSpan = document.createElement('span');
                letterSpan.className = 'option-letter';
                letterSpan.textContent = letters[idx];

                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.textContent = optionText;

                btn.append(letterSpan, textSpan);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex, clickedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const currentQ = quizQuestions[currentIndex];
            const allOptionBtns = document.querySelectorAll('.option-btn');
            const feedbackEl = document.getElementById('feedbackText');

            allOptionBtns.forEach(btn => {
                btn.disabled = true;
            });

            if (selectedIndex === currentQ.correctIndex) {
                clickedBtn.classList.add('correct');
                score++;
                document.getElementById('scoreDisplay').textContent = score;
                feedbackEl.textContent = 'Correct! +1 point added to your HR score.';
                feedbackEl.style.color = '#16a34a';
            } else {
                clickedBtn.classList.add('wrong');
                allOptionBtns[currentQ.correctIndex].classList.add('correct');
                feedbackEl.textContent = `Incorrect. Correct answer: ${letters[currentQ.correctIndex]}.`;
                feedbackEl.style.color = '#dc2626';
            }

            document.getElementById('nextButton').disabled = false;
        }

        function nextQuestion() {
            currentIndex++;
            if (quizQuestions.length > currentIndex) {
                loadQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('quizBody').style.display = 'none';
            document.getElementById('hudRow').style.display = 'none';
            const resultBox = document.getElementById('resultSection');
            resultBox.style.display = 'block';
            document.getElementById('finalScoreText').textContent =
                `You scored ${score} out of ${quizQuestions.length} (${Math.round((score / quizQuestions.length) * 100)}%) on the HR Policy Assessment.`;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('quizBody').style.display = 'block';
            document.getElementById('hudRow').style.display = 'flex';
            loadQuestion();
        }

        loadQuestion();
    </script>

</body>
</html>
